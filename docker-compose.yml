services:
  postgres:
    image: postgres:16-alpine
    container_name: club_booking_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-club_booking}
      POSTGRES_USER: ${DB_USER:-club_booking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-club_booking} -d ${DB_NAME:-club_booking}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: club_booking_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    container_name: club_booking_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-backend,localhost,127.0.0.1}
      DB_ENGINE: postgresql
      DB_NAME: ${DB_NAME:-club_booking}
      DB_USER: ${DB_USER:-club_booking}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
    volumes:
      - ${MEDIA_HOST_PATH:-./media}:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    container_name: club_booking_bot
    restart: unless-stopped
    command: python manage.py run_telegram_bot
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-backend,localhost,127.0.0.1}
      DB_ENGINE: postgresql
      DB_NAME: ${DB_NAME:-club_booking}
      DB_USER: ${DB_USER:-club_booking}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: club_booking_frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000/api/v1}
      NUXT_DJANGO_API_BASE_URL: http://backend:8000/api/v1
      NUXT_TRUST_PROXY_HEADERS: ${NUXT_TRUST_PROXY_HEADERS:-false}
      NUXT_HSTS_SECONDS: ${NUXT_HSTS_SECONDS:-0}
      NUXT_HSTS_INCLUDE_SUBDOMAINS: ${NUXT_HSTS_INCLUDE_SUBDOMAINS:-false}
      NUXT_HSTS_PRELOAD: ${NUXT_HSTS_PRELOAD:-false}
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
