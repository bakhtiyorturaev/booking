<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
    <g id="star">
      <polygon fill="#ffffff" points="0,-7.5 2.3,-2.3 7.8,-2.3 3.4,1 5,6.3 0,3 -5,6.3 -3.4,1 -7.8,-2.3 -2.3,-2.3"/>
    </g>
  </defs>
  <g clip-path="url(#circle-clip)">
    <!-- Blue top stripe -->
    <rect x="0" y="0" width="512" height="162" fill="#0099b5"/>
    <!-- Red line 1 -->
    <rect x="0" y="162" width="512" height="10" fill="#ce1126"/>
    <!-- White middle stripe -->
    <rect x="0" y="172" width="512" height="168" fill="#ffffff"/>
    <!-- Red line 2 -->
    <rect x="0" y="340" width="512" height="10" fill="#ce1126"/>
    <!-- Green bottom stripe -->
    <rect x="0" y="350" width="512" height="162" fill="#1eb53a"/>
    
    <!-- Crescent -->
    <circle cx="120" cy="81" r="42" fill="#ffffff"/>
    <circle cx="134" cy="81" r="35" fill="#0099b5"/>

    <!-- 12 Stars: 3 in row 1, 4 in row 2, 5 in row 3 -->
    <!-- Row 1 (top): 3 stars -->
    <use href="#star" x="210" y="45" transform="scale(1.3) translate(-25,-5)"/>
    <use href="#star" x="235" y="45" transform="scale(1.3) translate(-25,-5)"/>
    <use href="#star" x="260" y="45" transform="scale(1.3) translate(-25,-5)"/>
    <!-- Row 2 (middle): 4 stars -->
    <use href="#star" x="185" y="75" transform="scale(1.3) translate(-20,-5)"/>
    <use href="#star" x="210" y="75" transform="scale(1.3) translate(-20,-5)"/>
    <use href="#star" x="235" y="75" transform="scale(1.3) translate(-20,-5)"/>
    <use href="#star" x="260" y="75" transform="scale(1.3) translate(-20,-5)"/>
    <!-- Row 3 (bottom): 5 stars -->
    <use href="#star" x="160" y="105" transform="scale(1.3) translate(-15,-5)"/>
    <use href="#star" x="185" y="105" transform="scale(1.3) translate(-15,-5)"/>
    <use href="#star" x="210" y="105" transform="scale(1.3) translate(-15,-5)"/>
    <use href="#star" x="235" y="105" transform="scale(1.3) translate(-15,-5)"/>
    <use href="#star" x="260" y="105" transform="scale(1.3) translate(-15,-5)"/>
  </g>
</svg>
